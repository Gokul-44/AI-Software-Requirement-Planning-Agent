# Render Blueprint for the API (apps/api). The website (apps/web) is hosted on Vercel.
# Secret values are NOT stored here: variables marked `sync: false` are entered by hand in the
# Render dashboard. Docs: docs/guides/deployment.md.
services:
  - type: web
    name: spm-planning-agent-api
    runtime: node
    plan: free
    # Same area as the Neon database (aws-ap-southeast-1).
    region: singapore
    # `--include=dev` because the build needs TypeScript even when NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    # Deploys are triggered by .github/workflows/deploy.yml (after CI and the migration), not by Render.
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MIN_INTERVAL_MS
        value: '6500'
      - key: DAILY_RUN_CAP
        value: '15'
      - key: RATE_LIMIT_RUNS_PER_HOUR
        value: '3'
      - key: MAX_CONCURRENT_RUNS
        value: '1'
      - key: LOG_LEVEL
        value: info
      # Entered by hand in the dashboard (see docs/guides/deployment.md):
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
